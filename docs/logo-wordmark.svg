  <g transform="translate(30 33)">
    <rect width="84" height="84" rx="19" fill="#171717"/>
    <circle cx="42" cy="42" r="21" fill="none" stroke="#fafafa" stroke-width="5"/>
    <circle cx="42" cy="42" r="7.6" fill="#fafafa"/>
  </g>
  <text x="142" y="82" font-family="-apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.4" fill="#171717">Cherubyte</text>
  <text x="145" y="112" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="12" letter-spacing="2.8" fill="#8a8a8f">SELF-HOSTED NETWORK MONITOR</text>
