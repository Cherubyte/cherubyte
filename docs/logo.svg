<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NetScan">
  <rect width="120" height="120" rx="20" fill="#0a0b0d"/>
  <!-- 2x2 board: one live node (safety orange), the rest idle -->
  <g>
    <rect x="24" y="24" width="32" height="32" rx="3" fill="#ff5a1f"/>
    <rect x="64" y="24" width="32" height="32" rx="3" fill="#303640"/>
    <rect x="24" y="64" width="32" height="32" rx="3" fill="#303640"/>
    <rect x="64" y="64" width="32" height="32" rx="3" fill="#303640"/>
  </g>
  <!-- scan tick: a hairline crossing the live node -->
  <path d="M24 40 H96" stroke="#ff5a1f" stroke-width="2" opacity="0.35"/>
</svg>
