[project]
name = "netscan-protocol"
version = "3.0.0"
description = "The wire contract between a NetScan agent and a NetScan panel."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netscan_protocol*"]
