<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      href="/fonts/Inter-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23fafaf9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23fafaf9'/%3E%3C/svg%3E"
    />
    <title>Cherubyte</title>
    <script>
      /*
        Set the theme before the first paint. The React module does the same
        thing, but it only runs once the bundle has been fetched and executed —
        so without this a dark-mode visitor gets a white flash on every load,
        and the flash gets worse the more the app follows the OS.

        Mirrors readPref()/resolve() in src/hooks/useTheme.ts. Kept tiny on
        purpose: the module re-applies immediately after, so any divergence
        costs a flicker rather than a wrong theme.
      */
      (function () {
        try {
          var p = localStorage.getItem("cherubyte-theme-pref");
          var dark =
            p === "dark" ||
            ((p !== "light") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode, or no matchMedia — fall through to the light sheet */
        }
      })();
    </script>
  </head>
  <body>
    <!--
      DIRECTION — "STUDIO" (supersedes v8 "CHART")
      THESIS: a calm, near-monochrome instrument in the spirit of an Apple
        system app / curated.supply — near-black ink on a warm off-white ground,
        hairline rules, generous rhythm, restraint. Weight and space carry the
        hierarchy; red is held back for a real alert or a destructive action.
      TYPE: Inter (UI) · system monospace (addresses, timestamps, counts).
      MOTION: interruptible springs via motion/react (see src/lib/motion.ts),
        all of it optional under prefers-reduced-motion.
      TOKENS: src/index.css (:root light, :root.dark night) — names in tailwind.config.js.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
