    <title>NetScan</title>

  <body>
    <!--
      DIRECTION — "CHART" (supersedes v7 "INSTRUMENT", seed 0192d9d2, mode operate)
      THESIS: the LAN is charted water and the panel is its hydrographic chart —
        every device a plotted contact, not a card. Refuses the dark observability
        dashboard (sidebar + stat-tile grid + one accent) that the last seven
        directions all drifted into.
      OWN-WORLD: ink-on-chart-paper by default (warm buff #f4efe4, ink #1b2b33),
        one spot colour — chart warning carmine #c8102e — used only for a real
        caution or the live/selected mark; a desaturated water tint #7fa8a0 owns
        the plan ground and known-contact rows. ECDIS-night palette for dark.
        Hairline linework, near-square corners, near-flat depth. Big Shoulders
        (signage display), Overpass (Highway-Gothic UI), Overpass Mono (soundings,
        MACs, coordinates, timestamps). A graticule ground; contacts carry a
        symbol + a leader-tethered label + a sounding.
      STORY: the operator reads the plan — online / present / new / caution — in
        one look, then follows a contact's leader into its detail plate.
      FIRST VIEWPORT: a fixed chart margin (title block, index, scale, epoch clock)
        around the plot. The dashboard opens on the plan cluster — online/total,
        present, new, internet — then the contact register as one continuous sheet.
      FORM: operator dashboard; grounded candidate 5 of 7 (hydrographic chart +
        AIS). Signature: a survey line advances once down the plot per sweep, and
        the only "something changed" motion anywhere is a single hard chart-negative
        flash on a new contact. Motion otherwise: one quiet route fade, press-scale.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
